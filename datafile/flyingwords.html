<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Latające Słówka - Nauka Angielskiego 3D (bez klikania)</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family:'Comic Sans MS','Segoe UI',sans-serif; overflow:hidden; background:#0a0a2e; }

  #hud {
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 18px; pointer-events:none;
  }
  .hud-box {
    background:rgba(20,10,50,0.75); border:3px solid #c264ff; border-radius:18px;
    padding:8px 18px; color:#fff; font-weight:bold; font-size:20px;
    box-shadow:0 0 18px rgba(194,100,255,0.6);
  }

  #captionBox {
    position:fixed; bottom:8%; left:50%; transform:translateX(-50%);
    z-index:20; text-align:center; pointer-events:none;
  }
  #captionEn {
    font-size:44px; font-weight:bold; color:#fff; text-shadow:0 0 18px #c264ff;
    opacity:0; transition:opacity 0.4s;
  }
  #captionPl {
    font-size:24px; font-weight:bold; color:#ffe066; text-shadow:0 0 12px #ff9d00;
    opacity:0; transition:opacity 0.4s; margin-top:4px;
  }
  #captionEn.show, #captionPl.show { opacity:1; }

  #startScreen {
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(circle at 50% 30%, #2a1a5e 0%, #05051a 100%);
    color:#fff; padding:20px;
  }
  #startScreen h1 { font-size:40px; color:#c264ff; text-shadow:0 0 20px #7b2ff7; margin-bottom:10px; }
  #startScreen p { font-size:19px; max-width:480px; margin-bottom:18px; line-height:1.5; }
  .bigBtn {
    font-size:28px; font-weight:bold; padding:18px 44px; border-radius:40px;
    border:4px solid #fff; background:linear-gradient(135deg,#c264ff,#7b2ff7);
    color:#fff; cursor:pointer; box-shadow:0 0 30px rgba(194,100,255,0.6);
  }
  .bigBtn:active { transform:scale(0.94); }
  .rowBtns { display:flex; gap:14px; margin-bottom:18px; flex-wrap:wrap; justify-content:center; }
  .levelBtn {
    font-size:17px; font-weight:bold; padding:11px 20px; border-radius:16px;
    border:3px solid #c264ff; background:rgba(194,100,255,0.15); color:#fff; cursor:pointer;
  }
  .levelBtn.active { background:#c264ff; color:#1a0a2e; }
  .settingLabel { font-size:14px; opacity:0.8; margin-bottom:6px; }

  #controls {
    position:fixed; bottom:18px; right:18px; z-index:20; display:flex; gap:10px;
  }
  #controls button {
    pointer-events:auto; cursor:pointer;
  }

  .hidden { display:none !important; }
</style>
</head>
<body>

<div id="startScreen">
  <h1>💫 LATAJĄCE SŁÓWKA</h1>
  <p>Nic nie trzeba klikać — po prostu patrz i słuchaj. Słówko przyleci bliżej, zostanie przeczytane po angielsku i po polsku, a potem odleci i pojawi się kolejne. 🌌</p>
  <div class="rowBtns">
    <button class="levelBtn active" data-lvl="animals">🐶 Zwierzęta</button>
    <button class="levelBtn" data-lvl="colors">🎨 Kolory</button>
    <button class="levelBtn" data-lvl="food">🍎 Jedzenie</button>
    <button class="levelBtn" data-lvl="numbers">🔢 Liczby</button>
  </div>
  <div class="rowBtns">
    <div>
      <div class="settingLabel">🐢 Tempo</div>
      <button class="levelBtn active" id="speedNormalBtn">Normalne</button>
      <button class="levelBtn" id="speedSlowBtn">Bardzo spokojne</button>
    </div>
  </div>
  <button class="bigBtn" id="startBtn">▶ START!</button>
</div>

<div id="hud" class="hidden">
  <div class="hud-box">💫 <span id="counter">0</span> słówek</div>
</div>
<div id="captionBox">
  <div id="captionEn"></div>
  <div id="captionPl"></div>
</div>
<div id="controls" class="hidden">
  <button class="hud-box" id="pauseBtn" style="border-color:#ffe066;">⏸ Pauza</button>
  <button class="hud-box" id="stopBtn" style="border-color:#ff8a5b;">🏁 Zakończ</button>
</div>

<a-scene id="scene" class="hidden" background="color:#0a0a2e" vr-mode-ui="enabled:false">
  <a-entity id="stars"></a-entity>
  <a-entity id="flyerRig" position="0 1.6 0"></a-entity>

  <a-camera id="cam" position="0 1.6 0" look-controls-enabled="false" wasd-controls-enabled="false"></a-camera>

  <a-light type="ambient" color="#9a8cff" intensity="0.85"></a-light>
  <a-light type="point" position="0 3 2" color="#ffffff" intensity="0.6"></a-light>
</a-scene>

<script>
/* =====================  DANE SŁÓWEK  ===================== */
const WORD_SETS = {
  animals: [
    ["pies","dog"],["kot","cat"],["ptak","bird"],["ryba","fish"],["koń","horse"],
    ["krowa","cow"],["świnia","pig"],["kaczka","duck"],["żaba","frog"],["lew","lion"]
  ],
  colors: [
    ["czerwony","red"],["niebieski","blue"],["zielony","green"],["żółty","yellow"],
    ["różowy","pink"],["fioletowy","purple"],["pomarańczowy","orange"],["biały","white"],["czarny","black"]
  ],
  food: [
    ["jabłko","apple"],["banan","banana"],["chleb","bread"],["mleko","milk"],
    ["ser","cheese"],["ciastko","cookie"],["woda","water"],["jajko","egg"],["zupa","soup"]
  ],
  numbers: [
    ["jeden","one"],["dwa","two"],["trzy","three"],["cztery","four"],["pięć","five"],
    ["sześć","six"],["siedem","seven"],["osiem","eight"],["dziewięć","nine"],["dziesięć","ten"]
  ]
};

const COLORS_3D = ["#c264ff","#4dd0ff","#7CFC00","#ffd200","#ff5e5e","#ff9d00","#ff6ec7","#00e5c0"];

let state = {
  level:"animals", slowMode:false, playing:false, paused:false,
  counter:0, usedWords:[], currentFlyer:null
};

/* =====================  UI START  ===================== */
document.querySelectorAll('[data-lvl]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('[data-lvl]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.level = btn.dataset.lvl;
  });
});
document.getElementById('speedNormalBtn').addEventListener('click', ()=>{
  document.getElementById('speedNormalBtn').classList.add('active');
  document.getElementById('speedSlowBtn').classList.remove('active');
  state.slowMode = false;
});
document.getElementById('speedSlowBtn').addEventListener('click', ()=>{
  document.getElementById('speedSlowBtn').classList.add('active');
  document.getElementById('speedNormalBtn').classList.remove('active');
  state.slowMode = true;
});
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('stopBtn').addEventListener('click', stopGame);
document.getElementById('pauseBtn').addEventListener('click', togglePause);

/* =====================  START  ===================== */
function startGame(){
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('controls').classList.remove('hidden');
  document.getElementById('scene').classList.remove('hidden');

  state.playing = true;
  state.paused = false;
  state.counter = 0;
  state.usedWords = [];
  document.getElementById('counter').textContent = state.counter;
  buildStarfield();

  spawnNextFlyer();
}

function togglePause(){
  state.paused = !state.paused;
  const btn = document.getElementById('pauseBtn');
  btn.textContent = state.paused ? "▶ Wznów" : "⏸ Pauza";
  if(state.paused){
    if('speechSynthesis' in window) window.speechSynthesis.pause();
    if(state.currentFlyer) state.currentFlyer.removeAttribute('animation__fly');
  } else {
    if('speechSynthesis' in window) window.speechSynthesis.resume();
    // wznowienie animacji obsłuży kolejny krok automatycznie
  }
}

function stopGame(){
  state.playing = false;
  state.paused = false;
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  clearFlyer();
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('scene').classList.add('hidden');
  document.getElementById('captionEn').classList.remove('show');
  document.getElementById('captionPl').classList.remove('show');
  document.getElementById('pauseBtn').textContent = "⏸ Pauza";
  document.getElementById('startScreen').classList.remove('hidden');
}

/* =====================  GWIAZDY  ===================== */
function buildStarfield(){
  const container = document.getElementById('stars');
  container.innerHTML = "";
  for(let i=0;i<70;i++){
    const s = document.createElement('a-entity');
    const r = (Math.random()*40)+6;
    const theta = Math.random()*Math.PI*2;
    const y = (Math.random()*20)-4;
    s.setAttribute('geometry','primitive:sphere;radius:0.05');
    s.setAttribute('material','color:#ffffff;emissive:#ffffff;emissiveIntensity:0.9');
    s.setAttribute('position', `${Math.cos(theta)*r} ${y} ${Math.sin(theta)*r - 8}`);
    container.appendChild(s);
  }
}

function clearFlyer(){
  if(state.currentFlyer && state.currentFlyer.parentNode){ state.currentFlyer.remove(); }
  state.currentFlyer = null;
}

/* =====================  WYBÓR NASTĘPNEGO SŁOWA  ===================== */
function pickNextWord(){
  const pool = WORD_SETS[state.level];
  if(state.usedWords.length >= pool.length) state.usedWords = [];
  let candidates = pool.filter((w,i)=>!state.usedWords.includes(i));
  const idx = pool.indexOf(candidates[Math.floor(Math.random()*candidates.length)]);
  state.usedWords.push(idx);
  return pool[idx];
}

/* =====================  TWORZENIE I LOT OBIEKTU  ===================== */
function spawnNextFlyer(){
  if(!state.playing || state.paused){
    if(state.playing){ setTimeout(spawnNextFlyer, 400); } // czekaj aż pauza się skończy
    return;
  }
  clearFlyer();

  const [pl, en] = pickNextWord();
  const color = COLORS_3D[Math.floor(Math.random()*COLORS_3D.length)];
  const xOff = (Math.random()*2)-1;
  const yOff = (Math.random()*0.6)-0.3;

  const flyer = document.createElement('a-entity');
  flyer.setAttribute('geometry','primitive:sphere; radius:0.9');
  flyer.setAttribute('material', `color:${color}; roughness:0.3; metalness:0.2; emissive:${color}; emissiveIntensity:0.25`);
  flyer.setAttribute('position', `${xOff} ${1.6+yOff} -18`);
  flyer.setAttribute('animation__spin','property:rotation; to:0 360 0; loop:true; dur:5000; easing:linear');

  const label = document.createElement('a-entity');
  label.setAttribute('troika-text', `value:${en}; color:#ffffff; fontSize:0.55; align:center; outlineWidth:0.03; outlineColor:#000000`);
  label.setAttribute('position','0 1.15 0');
  label.setAttribute('billboard','');
  flyer.appendChild(label);

  document.getElementById('flyerRig').appendChild(flyer);
  state.currentFlyer = flyer;

  const approachDur = state.slowMode ? 5200 : 3000;
  const closeZ = -2.2;

  // faza 1: podlot bliżej widza
  flyer.setAttribute('animation__fly', `property:position; to:${xOff} ${1.6+yOff} ${closeZ}; dur:${approachDur}; easing:easeOutQuad`);

  setTimeout(()=>{
    if(!state.playing) return;
    if(state.paused){ waitForResumeThenSpeak(flyer, en, pl, xOff, yOff); return; }
    speakAndContinue(flyer, en, pl, xOff, yOff);
  }, approachDur);
}

function waitForResumeThenSpeak(flyer, en, pl, xOff, yOff){
  if(!state.playing) return;
  if(state.paused){ setTimeout(()=>waitForResumeThenSpeak(flyer,en,pl,xOff,yOff), 400); return; }
  speakAndContinue(flyer, en, pl, xOff, yOff);
}

function speakAndContinue(flyer, en, pl, xOff, yOff){
  if(!state.playing || state.currentFlyer !== flyer) return;

  state.counter++;
  document.getElementById('counter').textContent = state.counter;

  const capEn = document.getElementById('captionEn');
  const capPl = document.getElementById('captionPl');
  capEn.textContent = en.toUpperCase();
  capPl.textContent = pl;
  capEn.classList.add('show');
  capPl.classList.remove('show');

  speakWord(en, pl,
    ()=>{ capPl.classList.add('show'); },   // po angielskim - pokaż polskie
    ()=>{                                    // po polskim - kontynuuj lot
      capEn.classList.remove('show');
      capPl.classList.remove('show');
      if(!state.playing || state.currentFlyer !== flyer) return;

      const passDur = state.slowMode ? 1800 : 1000;
      flyer.setAttribute('material', 'transparent:true');
      flyer.setAttribute('animation__pass', `property:position; to:${xOff} ${1.6+yOff+0.3} 2; dur:${passDur}; easing:easeInQuad`);
      flyer.setAttribute('animation__fade', `property:material.opacity; to:0; dur:${passDur}; easing:linear`);

      setTimeout(()=>{
        if(state.currentFlyer === flyer) clearFlyer();
        spawnNextFlyer();
      }, passDur);
    }
  );
}

AFRAME.registerComponent('billboard', {
  tick:function(){
    const cam = document.getElementById('cam');
    if(!cam) return;
    const camPos = new THREE.Vector3();
    cam.object3D.getWorldPosition(camPos);
    this.el.object3D.lookAt(camPos);
  }
});

/* =====================  TTS  ===================== */
function speakWord(englishWord, polishWord, onEnglishDone, onAllDone){
  if(!('speechSynthesis' in window)){
    onEnglishDone();
    setTimeout(onAllDone, 900);
    return;
  }
  window.speechSynthesis.cancel();

  const uEn = new SpeechSynthesisUtterance(englishWord);
  uEn.lang = 'en-US'; uEn.rate = state.slowMode ? 0.7 : 0.85;
  const uPl = new SpeechSynthesisUtterance(polishWord);
  uPl.lang = 'pl-PL'; uPl.rate = state.slowMode ? 0.7 : 0.85;

  let done = false;
  const finish = ()=>{ if(!done){ done=true; onAllDone(); } };
  const safety = setTimeout(finish, 4500);

  uEn.onend = ()=>{ onEnglishDone(); window.speechSynthesis.speak(uPl); };
  uEn.onerror = ()=>{ onEnglishDone(); window.speechSynthesis.speak(uPl); };
  uPl.onend = ()=>{ clearTimeout(safety); finish(); };
  uPl.onerror = ()=>{ clearTimeout(safety); finish(); };

  window.speechSynthesis.speak(uEn);
}
</script>
</body>
</html>
